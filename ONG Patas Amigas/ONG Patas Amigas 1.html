<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patas Amigas</title>
<link rel="stylesheet" href="css/style.css">

 <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
        }

        h2 {
            color: #333;
        }

        picture img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }
    </style>

  <body>

      <picture>
        <source srcset="img-cachorro-1.jpg" media="(max-width: 600px)">
        <source srcset="img-cachorro-2.jpg" media="(max-width: 1200px)">
        <source srcset="img-cachorro-3.jpg">
        
        <img src="cachorro-2.jpg" alt="Cachorro">
    </picture>

<header>
  <div class="logo">🐾 Patas Amigas</div>
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  <nav id="menu">
    <a href="#home">Home</a>
    <a href="#adocao">Adoção</a>
    <a href="#ajuda">Como Ajudar</a>
    <a href="#galeria">Galeria</a>
    <a href="#sobre">Sobre</a>
    <a href="#contato">Contato</a>
  </nav>
</header>

<section id="home" class="hero">
  <h1>Adote um amigo, salve uma vida 🐶❤️</h1>
  <button onclick="scrollToSection('adocao')">Ver animais</button>
</section>

<section class="Adoção">
  <h2>Animais em Destaque</h2>
  <div id="listaAnimais"></div>
</section>

<section class="Ajuda">
  <h2>Como Ajudar</h2>
    <button onclick="doar()">Doar</button>
    <button onclick="irWhats()">Falar no WhatsApp</button>
    <button onclick="voluntario()">Ser Voluntário</button>
</section>

<section id="form-adocao">
  <h2>Formulário de Adoção</h2>
  <form id="adocaoForm">
    <input type="text" placeholder="Nome" required>
    <input type="email" placeholder="Email" required>
    <textarea placeholder="Por que deseja adotar?"></textarea>
    <button type="submit">Enviar</button>
  </form>
</section>

<div class="card">
      <picture>
        <source srcset="http://localhost:3000/uploads/${p.imagem}" media="(max-width: 600px)">
        <source srcset="http://localhost:3000/uploads/${p.imagem}" media="(max-width: 1200px)">
        <img src="http://localhost:3000/uploads/${p.imagem}" alt="${p.nome}">
      </picture>
      <h3>${p.nome}</h3>
      <p>${p.idade}</p>
    </div>

<a href="https://wa.me/5512981764183" class="whatsapp">💬</a>

<script src="js/app.js"></script>
</body>
</html>
